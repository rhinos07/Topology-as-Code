# Optional vendor-specific data exported by a WMS and needed for re-import.
# Generic tooling validates the envelope and entity references, but preserves
# payload fields opaquely and losslessly.
api_version: "topology-as-code/extension-v1"

extension:
  namespace: "com.example.wms"
  version: "1.0"
  dataset_id: "example_customer/pa11/hall_3"
  records:
    - entity_type: "storage_point"
      entity_id: "HBR.01-01-06"
      payload:
        internal_location_key: 47110815
        putaway_sequence: 120

    - entity_type: "storage_type"
      entity_id: "HBR"
      payload:
        proprietary_area_class: "ASRS_HIGH_BAY"

    # Any compiled entity type can carry vendor data, including the
    # rack-statics and routing entities.
    - entity_type: "bay"
      entity_id: "HBR.F01-01"
      payload:
        rack_inspection_tag: "RI-2026-0117"

    - entity_type: "route_aisle"
      entity_id: "HBR.A01"
      payload:
        device_aisle_no: 1
