# Reusable, rarely changed building blocks.
# Referenced by structure/lanes.yaml (lane_templates) and
# structure/storage.yaml (workstation_templates, storage_templates).

# Physical characteristics of a kind of storage location, factored out of
# the individual buildings that use it. Referenced by
# structure/storage.yaml -> storage_type.template.
#
# A storage_template carries only what is intrinsic to the location kind
# (how heavy, how big, which carriers fit). Everything building-specific -
# zone, section, position - stays on the storage_type itself and is
# deliberately not expressible here.
#
# Merge semantics: the template supplies default_attributes values; the
# storage_type's own default_attributes override them KEY BY KEY, and a
# storage_point exception overrides those in turn. The merge is shallow,
# so overriding a nested key such as 'size' replaces the whole object
# rather than merging into it - same semantics storage_point exceptions
# already use.
#
# (An earlier rack_templates catalog lived here and was removed as dead:
# no schema field ever let a storage_type reference it. This catalog is
# that idea reconnected - see Warehouse-as-Code ADR-0001.)
storage_templates:
  - id: "pallet_bay_euro_1000"
    description: "Single euro-pallet bay, 1000 kg design load - the standard bay used across cold and channel storage."
    max_weight: { value: 1000, unit: "kg" }
    capacity_per_point: 1
    size:
      width: { value: 1.2, unit: "m" }
      depth: { value: 0.8, unit: "m" }
      height: { value: 0.4, unit: "m" }
    allowed_load_unit_types: ["pallet_euro"]

  - id: "heavy_bay_1500"
    description: "Ambient location rated for a 1500 kg load unit, one unit per point. Carrier types stay open - the using storage_type decides them."
    max_weight: { value: 1500, unit: "kg" }
    temperature_zone: "ambient"
    capacity_per_point: 1

  - id: "autostore_bin_location"
    description: "An AutoStore grid, one opaque place for the WMS. Allows all three bin heights; a storage type can narrow the list. No capacity: the controller manages the grid."
    max_weight: { value: 30, unit: "kg" }
    temperature_zone: "ambient"
    allowed_load_unit_types: ["autostore_bin_220", "autostore_bin_330", "autostore_bin_425"]

lane_templates:
  - id: "lane_shuttle_standard"
    width: { value: 2.5, unit: "m" }
    direction: "bidirectional"
    shuttle_compatible: true
    max_speed: { value: 1.5, unit: "m/s" }

workstation_templates:
  - id: "ws_pick_to_light"
    type: "pick-to-light"
    ergonomic_class: "standing"
    throughput_capacity: 120
    throughput_unit: "picks_per_hour"

  - id: "ws_autostore_port"
    type: "goods-to-person"
    ergonomic_class: "standing"
    throughput_capacity: 650  # nominal AutoStore port throughput
    throughput_unit: "load_units_per_hour"
