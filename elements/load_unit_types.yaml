# Reusable definitions of physical load unit types (pallets, containers,
# cartons). Owned here since MasterData-as-Code took over the catalog from
# Topology-as-Code (Warehouse-as-Code backlog D1). Topology-as-Code keeps a
# pinned, byte-identical copy for its storage-envelope checks - after a
# change here, update the pin there (Topology-as-Code tools/sync_catalogs.py).
# Validates against schemas/load-unit-type.schema.json (per entry).
#
# tare_weight values are approximate examples, not taken from a standard -
# check them against the carrier actually used.

load_unit_types:
  - id: "pallet_euro"
    description: "EUR-pallet (EPAL), 800x1200mm"
    dimensions:
      width: { value: 0.8, unit: "m" }
      depth: { value: 1.2, unit: "m" }
      height: { value: 0.144, unit: "m" }
    max_weight: { value: 1000, unit: "kg" }
    tare_weight: { value: 25, unit: "kg" }
    stackable: true
    volume: { value: 0.138, unit: "m3" }

  - id: "pallet_industrial"
    description: "Industrial pallet, 1000x1200mm"
    dimensions:
      width: { value: 1.0, unit: "m" }
      depth: { value: 1.2, unit: "m" }
      height: { value: 0.144, unit: "m" }
    max_weight: { value: 1500, unit: "kg" }
    tare_weight: { value: 30, unit: "kg" }
    stackable: true
    volume: { value: 0.173, unit: "m3" }

  - id: "mesh_box"
    description: "Wire mesh box container, 800x1200mm"
    dimensions:
      width: { value: 0.8, unit: "m" }
      depth: { value: 1.2, unit: "m" }
      height: { value: 0.97, unit: "m" }
    max_weight: { value: 700, unit: "kg" }
    tare_weight: { value: 85, unit: "kg" }
    stackable: true
    volume: { value: 0.931, unit: "m3" }

  - id: "carton"
    description: "Standard shipping carton"
    dimensions:
      width: { value: 0.4, unit: "m" }
      depth: { value: 0.3, unit: "m" }
      height: { value: 0.3, unit: "m" }
    max_weight: { value: 20, unit: "kg" }
    tare_weight: { value: 0.5, unit: "kg" }
    stackable: false
    volume: { value: 0.036, unit: "m3" }

  # AutoStore bins: vendor standard in three heights. Outer 649x449 mm,
  # inner 603x403 mm, max load 30 kg for all heights (AutoStore and Kardex
  # spec sheets). Inner heights 202/312/404 mm (Kardex spec sheet); volume =
  # inner volume. tare_weight values are examples, not vendor data.
  # Stack limits per grid differ between sources (e.g. 24 vs 26 bins at
  # 220 mm) and are a grid property, so they are not modelled here.
  - id: "autostore_bin_220"
    description: "AutoStore bin, 220mm high, 649x449mm footprint"
    dimensions:
      width: { value: 0.649, unit: "m" }
      depth: { value: 0.449, unit: "m" }
      height: { value: 0.22, unit: "m" }
    max_weight: { value: 30, unit: "kg" }
    tare_weight: { value: 2.5, unit: "kg" }
    stackable: true
    volume: { value: 0.049, unit: "m3" }

  - id: "autostore_bin_330"
    description: "AutoStore bin, 330mm high, 649x449mm footprint"
    dimensions:
      width: { value: 0.649, unit: "m" }
      depth: { value: 0.449, unit: "m" }
      height: { value: 0.33, unit: "m" }
    max_weight: { value: 30, unit: "kg" }
    tare_weight: { value: 3, unit: "kg" }
    stackable: true
    volume: { value: 0.076, unit: "m3" }

  - id: "autostore_bin_425"
    description: "AutoStore bin, 425mm high, 649x449mm footprint (needs R5+ class robots)"
    dimensions:
      width: { value: 0.649, unit: "m" }
      depth: { value: 0.449, unit: "m" }
      height: { value: 0.425, unit: "m" }
    max_weight: { value: 30, unit: "kg" }
    tare_weight: { value: 3.5, unit: "kg" }
    stackable: true
    volume: { value: 0.098, unit: "m3" }

  - id: "order_tote"
    description: "Order container that picked goods are placed into at a goods-to-person port (holds WIP for one or more orders)"
    dimensions:
      width: { value: 0.6, unit: "m" }
      depth: { value: 0.4, unit: "m" }
      height: { value: 0.32, unit: "m" }
    max_weight: { value: 25, unit: "kg" }
    tare_weight: { value: 1.5, unit: "kg" }
    stackable: true
    volume: { value: 0.077, unit: "m3" }
