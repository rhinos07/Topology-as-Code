# Reusable catalog of warehouse process types (goods receipt, goods issue, internal movement).
# Referenced by movement_rule.trigger.

process_types:
  - id: "putaway_task"
    category: "inbound"
    description: "Move goods from goods receipt into storage"

  - id: "pick_task"
    category: "outbound"
    description: "Retrieve goods from storage for goods issue"

  - id: "replenishment_task"
    category: "internal_movement"
    description: "Move goods from bulk storage to a pick face"

  - id: "bin_return"
    category: "internal_movement"
    description: "Return a bin/container to storage after a goods-to-person pick (e.g. an AutoStore bin re-stowed into the grid with its remaining stock)"

  - id: "bin_provision"
    category: "internal_movement"
    description: "Provide an empty bin/container at a port for induction/decanting (e.g. an empty AutoStore bin retrieved from the grid so goods can be packed into it)"

  - id: "clarification"
    category: "internal_movement"
    description: "Manual clarification of an identification error at a reporting point"

  - id: "cross_dock_task"
    category: "cross_dock"
    description: "Move goods directly from inbound staging to outbound staging, bypassing storage"

  - id: "goods_receipt"
    category: "inbound"
    description: "Unload goods at an inbound door into inbound staging, before putaway"

  - id: "returns_receipt"
    category: "inbound"
    description: "Receive customer returns at a returns door into returns staging, kept apart from regular goods receipt so they can be inspected and routed differently"

  - id: "quality_inspection"
    category: "internal_movement"
    description: "Move goods to a quality-inspection area and back, e.g. incoming inspection or stock on quality hold"

  - id: "relocation"
    category: "internal_movement"
    description: "Move stock between storage places without an order, e.g. consolidation, defragmentation or re-slotting"

  - id: "count_task"
    category: "internal_movement"
    description: "Bring stock to a counting place for a physical inventory count, e.g. a goods-to-person port. Counting in place without a movement is not a process type"

  - id: "pack_task"
    category: "outbound"
    description: "Move packed goods from a packing station to outbound staging"

  - id: "load_task"
    category: "outbound"
    description: "Move goods from outbound staging through an outbound door onto the truck"
